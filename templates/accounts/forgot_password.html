{% extends 'base.html' %}
{% block title %}Forgot Password - Al Ansaar Foundation{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-purple text-white text-center">
                    <h4 class="mb-0"><i class="bi bi-key"></i> Forgot Password</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted" style="font-size:14px;">Enter your <strong>Username</strong> or <strong>Email address</strong>. We will email you a new password.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username or Email</label>
                            <input type="text" name="identifier" class="form-control" required autofocus placeholder="e.g. johndoe or johndoe@example.com">
                        </div>
                        <button type="submit" class="btn btn-purple w-100">Email My Password</button>
                    </form>
                    <p class="text-center mt-3 mb-0">
                        Remembered it? <a href="{% url 'accounts:login' %}">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
